name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Needed by the last step, which attaches the APK to a release so it has a
    # download link that does not require a GitHub login. Everything else only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Works whether gradlew lives at the repo root or one level down
      # (e.g. TurtleLauncher/gradlew) - no need to hardcode the layout.
      - name: Locate the Android project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew | head -n1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found anywhere in this repo (checked 3 levels deep)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_DIR"

          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oE 'gradle-[0-9.]+-(bin|all)' "$PROPS" | head -n1 | sed -E 's/gradle-([0-9.]+)-(bin|all)/\1/')
          fi
          VERSION=${VERSION:-8.9}
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Gradle version: $VERSION"

      # Fixes: "Could not find or load main class org.gradle.wrapper.GradleWrapperMain"
      # That error means gradle/wrapper/gradle-wrapper.jar is missing, empty, or corrupt
      # in the repo - common with GitHub's web "Add files via upload" flow, which can
      # silently drop or mangle binary files. Rather than debug how it got lost, this
      # provisions a real Gradle install and has it write a fresh, correct wrapper jar
      # before gradlew is ever invoked, so the build no longer depends on whatever
      # actually made it into the repo.
      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Regenerate the Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        # The wrapper jar is tracked in the repo, so this step is only a repair for a missing
        # or corrupt one. If it cannot run (offline distribution, plugin lookup), carry on:
        # the actual build below uses ./gradlew and reports the real error if the jar were
        # genuinely broken, instead of failing here with a message about the wrapper.
        run: |
          gradle wrapper --gradle-version ${{ steps.locate.outputs.gradle_version }} \
            || echo "::warning::Could not regenerate the Gradle wrapper jar - using the one in the repo."


      # The Termux build pins aapt2 to a Termux-only ARM64 binary path that doesn't
      # exist on a normal Linux runner. Strip it so AGP falls back to the standard
      # aapt2 pulled from Google's Maven repo. Harmless no-op if the line isn't there.
      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' "${{ steps.locate.outputs.dir }}/gradle.properties" || true

      # gradle.properties is tuned for a phone: a 1 GB daemon heap and a single worker, with
      # parallel builds and the build cache off. A CI runner has 4 cores and 16 GB, and
      # packaging four ABIs of native libraries plus the assets with one worker is by far the
      # slowest part of a release build. These overrides are applied here, to the runner's
      # copy only - local and Termux builds keep the checked-in settings.
      - name: Tune Gradle for the runner
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i '/^org.gradle.workers.max=/d;/^org.gradle.parallel=/d;/^org.gradle.jvmargs=/d;/^org.gradle.configuration-cache=/d' gradle.properties
          printf '\n# CI overrides (see the "Tune Gradle for the runner" step)\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.configuration-cache=false\n' >> gradle.properties
          grep -E '^org.gradle' gradle.properties

      - name: Grant execute permission to gradlew
        run: chmod +x "${{ steps.locate.outputs.dir }}/gradlew"

      - name: Native bridge regression tests
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          python3 tests/check_resources.py
          python3 tests/check_launcher_art.py
          python3 tests/check_icons.py
          python3 tests/check_download_tabs.py
          python3 tests/check_translations.py
          python3 tests/check_glfw_overlay.py
          python3 tests/check_guest_bootstrap.py
          python3 tests/check_ui_lifecycle_guards.py
          python3 tests/check_performance_defaults.py
          python3 tests/check_game_engine.py
          python3 tests/check_jar_sealing.py
          python3 tests/check_social.py
          python3 tests/check_discord_presence.py
          python3 tests/check_dual_channel.py
          tests/native/run.sh
          tests/native/run-discord.sh

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          # Baked into BuildConfig.CURSEFORGE_API_KEY by build.gradle.kts, so the APK ships
          # with CurseForge search/downloads and modpack imports working out of the box.
          # Missing secret = empty key = the app asks the user for one in Settings instead.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Baked into BuildConfig.GEMINI_API_KEY by build.gradle.kts, so the APK ships with
          # Turtle AI working and no key to paste. Add it under
          # Settings -> Secrets and variables -> Actions -> New repository secret, named
          # GEMINI_API_KEY. Missing secret = empty key = the app falls back to asking the user
          # (the build still succeeds).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The launcher's release keystore (endiq-key.jks) is in the repo; this is its
          # password. Without it the build still succeeds, signed with the debug keystore.
          ENDIQ_KEYSTORE_PASSWORD: ${{ secrets.ENDIQ_KEYSTORE_PASSWORD }}
          # Read by build.gradle.kts for InfoDistributor.BUILD_TYPE, which decides whether the
          # app considers itself a release build (ZHTools.isRelease/isDebug/isPreRelease).
          ZL_BUILD_TYPE: RELEASE
        run: |
          set -o pipefail
          # Prefer the repo's wrapper, but fall back to the provisioned Gradle if the
          # tracked wrapper jar is unusable - a broken wrapper should not decide whether
          # the launcher can be built.
          GRADLE_CMD=./gradlew
          if ! $GRADLE_CMD --version >/dev/null 2>&1; then
            echo "::warning::./gradlew is not usable - building with the provisioned Gradle instead."
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD :TurtleLauncher:testDebugUnitTest :TurtleLauncher:assembleRelease --no-daemon --stacktrace 2>&1 \
            | tee /tmp/gradle-build.log

      - name: Verify release APK packaging
        working-directory: ${{ steps.locate.outputs.dir }}
        run: python3 tests/check_apk.py

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-unit-test-reports
          path: "**/build/test-results/testDebugUnitTest/*.xml"
          if-no-files-found: warn

      # The raw job log is a separate download and can be unreachable from a restricted
      # network, so the errors are repeated as annotations on the run itself.
      - name: Report the build failure
        if: failure()
        run: |
          LOG=/tmp/gradle-build.log
          if [ ! -f "$LOG" ]; then
            echo "::error title=Gradle build failed::No build output was captured."
            exit 0
          fi
          ERRORS=$(grep -E "^e:|^w: .*error|error:|FAILURE:|What went wrong|Caused by:|Execution failed for task|> Task .*FAILED|AAR metadata|requires libraries and applications|currently compiled against|minimum compile SDK|minCompileSdk" "$LOG" | head -60 || true)
          # assembleRelease also runs lintVitalRelease, whose findings are in its own report
          # rather than in the Gradle output.
          for REPORT in $(find . -name "lint-results*.txt" -o -name "lint-results*.xml" 2>/dev/null | head -3); do
            echo "----- $REPORT -----"
            LINTS=$(grep -E "Error|Fatal|severity=\"(Fatal|Error)\"" "$REPORT" | head -20 || true)
            echo "$LINTS"
            ERRORS=$(printf '%s\n%s' "$ERRORS" "$LINTS")
          done
          # Preserve the actual Gradle failure reason, not just a tail of stack frames.
          CONTEXT=$(sed -n '/^FAILURE:/,/^\* Exception is:/p' "$LOG" | head -100)
          ERRORS=$(printf '%s\n%s' "$CONTEXT" "$ERRORS")
          if [ -z "$ERRORS" ]; then ERRORS=$(tail -40 "$LOG"); fi
          echo "----- captured errors -----"
          printf '%s\n' "$ERRORS"
          ESCAPED=$(printf '%s' "$ERRORS" | head -c 20000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::$ESCAPED"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-release-apk
          path: "**/build/outputs/apk/release/*.apk"

      # Artifacts need a GitHub login and expire after 90 days, so the same APK is
      # attached to a release as well. That gives a stable, public download URL:
      #   https://github.com/knmusic321-coder/TurtleLauncher/releases/download/latest-apk/<file>.apk
      # The release is reused, so a later build replaces its assets instead of piling up
      # one release per commit.
      - name: Publish the APK to a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest-apk
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "TurtleLauncher APK (ban moi nhat / latest build)" \
              --notes "APK dung tu dong boi GitHub Actions tu commit $GITHUB_SHA tren nhanh $GITHUB_REF_NAME. Ban universal cai duoc tren ca 4 ABI (arm64-v8a, armeabi-v7a, x86, x86_64)."
          fi
          find . -path '*/build/outputs/apk/release/*.apk' \
            -exec gh release upload "$TAG" {} --clobber \;
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'

  # A separate job, not a second Gradle invocation in the job above: the ABI is read with
  # System.getProperty("arch") at configuration time, so a second assembleRelease in the same
  # workspace would reuse the already-configured project and could silently keep the
  # universal (all-ABI) packaging. A fresh runner guarantees the arm64-only variant, and
  # running in parallel with the universal build does not lengthen the pipeline.
  build-arm64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate the Android project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew | head -n1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found anywhere in this repo (checked 3 levels deep)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_DIR"

          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oE 'gradle-[0-9.]+-(bin|all)' "$PROPS" | head -n1 | sed -E 's/gradle-([0-9.]+)-(bin|all)/\1/')
          fi
          VERSION=${VERSION:-8.9}
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Regenerate the Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          gradle wrapper --gradle-version ${{ steps.locate.outputs.gradle_version }} \
            || echo "::warning::Could not regenerate the Gradle wrapper jar - using the one in the repo."

      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' "${{ steps.locate.outputs.dir }}/gradle.properties" || true

      - name: Tune Gradle for the runner
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i '/^org.gradle.workers.max=/d;/^org.gradle.parallel=/d;/^org.gradle.jvmargs=/d;/^org.gradle.configuration-cache=/d' gradle.properties
          printf '\n# CI overrides (see the "Tune Gradle for the runner" step)\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.configuration-cache=false\n' >> gradle.properties

      - name: Grant execute permission to gradlew
        run: chmod +x "${{ steps.locate.outputs.dir }}/gradlew"

      # ARCH/-Darch selects a single ABI through ndk.abiFilters (TurtleLauncher/build.gradle.kts,
      # buildAbi), so the APK is a normal standalone package that carries only arm64-v8a native
      # libraries, the arm64-v8a Horizon engine and the arm64 JRE archive. check_apk.py is not run
      # here: it asserts the universal APK contains all four ABIs, which this build must not.
      - name: Build arm64-v8a release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENDIQ_KEYSTORE_PASSWORD: ${{ secrets.ENDIQ_KEYSTORE_PASSWORD }}
          ZL_BUILD_TYPE: RELEASE
          # Read by the buildAbi block in TurtleLauncher/build.gradle.kts.
          ARCH: arm64
        run: |
          set -o pipefail
          GRADLE_CMD=./gradlew
          if ! $GRADLE_CMD --version >/dev/null 2>&1; then
            echo "::warning::./gradlew is not usable - building with the provisioned Gradle instead."
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD :TurtleLauncher:assembleRelease --no-daemon --stacktrace \
            -Darch=arm64 -Parch=arm64 2>&1 | tee /tmp/gradle-arm64.log

      - name: Collect the arm64-v8a APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          APK=$(find . -path '*/build/outputs/apk/release/*arm64*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No arm64-v8a APK was produced. Release APKs found:"
            find . -path '*/build/outputs/apk/release/*.apk' || true
            tail -60 /tmp/gradle-arm64.log || true
            exit 1
          fi
          echo "Built: $APK"
          # Stable asset name, so the download link never depends on the version string.
          cp "$APK" ./TurtleLauncher-arm64-v8a.apk

      # The published file has to be installable, not merely built. apksigner verifies the APK
      # signatures the way Android's PackageManager does, aapt2 parses the manifest back out of
      # the APK, zipalign confirms the archive layout Android's AssetManager needs, and the
      # SHA-256 is published with the APK so a download can be checked on the phone - that is how
      # a truncated download is told apart from a broken build.
      - name: Verify the arm64-v8a APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          APK=./TurtleLauncher-arm64-v8a.apk
          ls -l "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n1)
          echo "build-tools: $BT"
          test -x "$BT/apksigner"
          "$BT/aapt2" dump badging "$APK" | grep -E '^(package|sdkVersion|targetSdkVersion|native-code|launchable-activity)' || true
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c 4 "$APK" && echo "zipalign: OK"
          echo "native libraries in the APK:"
          unzip -l "$APK" 'lib/*' | awk '{print $4}' | grep -E '^lib/' | cut -d/ -f2 | sort -u
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-arm64-v8a-apk
          path: "${{ steps.locate.outputs.dir }}/TurtleLauncher-arm64-v8a.apk*"

      - name: Publish the arm64-v8a APK to a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest-apk
        run: |
          set -euo pipefail
          # The universal job may be creating the same release concurrently; losing that race
          # is fine as long as the tag exists by the time the asset is uploaded.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "TurtleLauncher APK (ban moi nhat / latest build)" \
              --notes "APK dung tu dong boi GitHub Actions. TurtleLauncher-arm64-v8a.apk chi chua thu vien native arm64-v8a (dien thoai Android 64-bit)." \
              || true
          fi
          gh release upload "$TAG" ./TurtleLauncher-arm64-v8a.apk ./TurtleLauncher-arm64-v8a.apk.sha256 --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
